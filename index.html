<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dad AI — play • learn • ask</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.js";
  </script>
  <style>
    :root { --card: rgba(255,255,255,.08); --ring: rgba(255,255,255,.18); }
    .card { background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--ring); border-radius: 18px; }
    .btn  { background:#ffd54a; color:#1f2937; font-weight:700; }
    .btn-sec { background: rgba(255,255,255,.6); font-weight:600; }
    .tag { background: rgba(0,0,0,.08); padding:.25rem .5rem; border-radius:20px; font-size:.85rem; }
    .cloud { background: rgba(255,255,255,.95); padding:2px 8px; border-radius:999px; display:inline-block; margin:0 auto 6px; font-size:13px; color:#475569; box-shadow: 0 6px 18px rgba(0,0,0,.07); }
    .toolbar button{ border-radius:14px; padding:.55rem .9rem; }
    canvas { touch-action: none; }
    .pill { background: rgba(255,255,255,.84); color:#334155; padding:6px 10px; border-radius: 999px; font-weight:600; }
  </style>
</head>
<body class="min-h-screen text-white" style="background: radial-gradient(1200px 700px at 20% -10%, #6d5dd7 0%, transparent 50%), radial-gradient(1000px 600px at 90% 0%, #4a90e2 0%, transparent 45%), #0b1021">
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <div class="card p-3 sm:p-4 flex items-center gap-4 justify-between">
      <div class="flex items-center gap-4">
        <div id="catFamily" class="flex gap-6 items-end"></div>
        <div>
          <div class="text-2xl sm:text-3xl font-black leading-tight">Dad <span class="text-yellow-300">AI</span></div>
          <div class="text-sm opacity-90">Ask, draw, guess, read books — English & Arabic</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input id="kid" class="px-3 py-2 rounded-lg text-gray-900" placeholder="Kid name (optional)"/>
        <button id="dadTab" class="btn-sec px-3 py-2 rounded-lg">👨‍👧 Dad Dashboard</button>
        <button id="settingsBtn" class="btn-sec px-3 py-2 rounded-lg">⚙️ Settings</button>
      </div>
    </div>

    <!-- Main two columns -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
      <div class="space-y-3">
        <!-- Modes -->
        <div class="card p-3">
          <div class="flex gap-2">
            <button class="pill" data-mode="ask">Ask</button>
            <button class="pill" data-mode="story">Story ✨</button>
            <button class="pill" data-mode="drawing">Drawing 🎨</button>
            <button class="pill" data-mode="book">Book Q&A 📚</button>
          </div>
        </div>

        <!-- Ask / Story -->
        <div id="askBox" class="card p-3 space-y-2">
          <div class="flex gap-2 items-stretch">
            <input id="question" class="flex-1 rounded-lg px-3 py-3 text-gray-900" placeholder="Why is the sky blue?"/>
            <button id="magic" class="btn px-4 rounded-lg">🔍</button>
          </div>
          <div class="flex gap-2">
            <button id="askBtn" class="btn px-4 py-2 rounded-lg">Ask!</button>
            <button id="readBtn" class="btn-sec px-4 py-2 rounded-lg">🔊 Read</button>
          </div>
          <div class="flex gap-2 toolbar">
            <button id="boing">🍇 Boing</button>
            <button id="zap">⚡️ Zap</button>
            <button id="pop">✨ Pop</button>
          </div>
        </div>

        <!-- Book Q&A tools -->
        <div id="bookBox" class="card p-3 hidden">
          <div class="flex flex-wrap gap-2 items-center">
            <input type="file" id="bookFile" accept=".txt,.pdf,.docx,.epub" class="hidden"/>
            <label for="bookFile" class="btn-sec px-3 py-2 rounded-lg cursor-pointer">📄 Upload book (TXT/PDF/DOCX/EPUB)</label>
            <button id="buildIdx" class="btn px-3 py-2 rounded-lg">🔎 Build Book Index</button>
            <span id="bookStatus" class="tag">No book</span>
          </div>
          <div class="text-xs mt-2 opacity-90">Dad AI first checks your uploaded book for answers before using AI.</div>
        </div>

        <!-- Drawing tools -->
        <div id="drawBox" class="card p-3 hidden">
          <div class="flex flex-wrap gap-2 items-center">
            <button id="pen" class="btn-sec">✏️ Pen</button>
            <button id="eraser" class="btn-sec">🧽 Eraser</button>
            <button id="clear" class="btn-sec">🧺 Clear</button>
            <button id="save" class="btn-sec">💾 Save PNG</button>
            <button id="guess" class="btn">🤖 Guess my drawing</button>
            <span id="aiState" class="tag">AI: loading…</span>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <span class="text-sm">Color</span>
            <input id="color" type="color" value="#000000"/>
            <span class="text-sm">Size</span>
            <input id="size" type="range" min="2" max="40" value="8"/>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <input id="whatToDraw" class="rounded-lg px-3 py-2 text-gray-900 flex-1" placeholder="Type an animal (cat, dog, bunny, bird, fish)…"/>
            <button id="drawIt" class="btn px-3 py-2 rounded-lg">🖼️ Draw it</button>
          </div>
        </div>

      </div>

      <!-- Answer column -->
      <div class="card p-3 min-h-[420px]">
        <div id="answerArea" class="h-[360px] overflow-auto">
          <div id="placeholder" class="opacity-70">Your answer shows here…</div>
          <div id="answerBubble" class="hidden">
            <div id="answer" class="text-lg leading-relaxed"></div>
            <div id="snips" class="mt-3 space-y-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Drawing canvas -->
    <div class="card p-3 mt-4">
      <canvas id="board" width="900" height="500" class="w-full bg-white rounded-xl"></canvas>
    </div>
  </div>

  <!-- Settings modal -->
  <dialog id="settingsDlg" class="card p-0 w-[min(520px,96vw)] text-gray-900">
    <form method="dialog">
      <div class="px-5 py-3 border-b font-semibold">Settings</div>
      <div class="p-5 space-y-3">
        <label class="text-sm">Gemini API key (optional for smarter answers)
          <input id="gemKey" class="w-full p-2 mt-1 rounded-lg border" placeholder="AIza…"/>
        </label>
        <label class="text-sm">Auto‑read answers (TTS)
          <input id="autoRead" type="checkbox" class="ml-2 align-middle"/>
        </label>
      </div>
      <div class="px-5 py-3 border-t flex justify-end"><button>Close</button></div>
    </form>
  </dialog>

  <!-- Dad dashboard modal -->
  <dialog id="dadDlg" class="card p-0 w-[min(780px,96vw)] text-gray-900">
    <form method="dialog">
      <div class="px-5 py-3 border-b font-semibold">Dad Dashboard</div>
      <div class="p-5 space-y-3">
        <label class="text-sm">Password
          <input id="dadPwd" type="password" class="w-full mt-1 p-2 rounded-lg border" placeholder="ADMIN_PASS"/>
        </label>
        <button id="dadLoad" type="button" class="px-3 py-2 rounded-lg bg-[#ffd54a] font-semibold">Load latest</button>
        <div id="faqList" class="mt-2 space-y-3"></div>
      </div>
      <div class="px-5 py-3 border-t flex justify-end"><button>Close</button></div>
    </form>
  </dialog>

  <script>
  // ========== State & Refs ==========
  const E = {
    kid: document.getElementById('kid'),
    settingsBtn: document.getElementById('settingsBtn'),
    settingsDlg: document.getElementById('settingsDlg'),
    gemKey: document.getElementById('gemKey'),
    autoRead: document.getElementById('autoRead'),
    catFamily: document.getElementById('catFamily'),
    answerArea: document.getElementById('answerArea'),
    bubble: document.getElementById('answerBubble'),
    answer: document.getElementById('answer'),
    snips: document.getElementById('snips'),
    placeholder: document.getElementById('placeholder'),
    askBtn: document.getElementById('askBtn'),
    readBtn: document.getElementById('readBtn'),
    q: document.getElementById('question'),
    magic: document.getElementById('magic'),
    modeBtns: document.querySelectorAll('[data-mode]'),
    askBox: document.getElementById('askBox'),
    drawBox: document.getElementById('drawBox'),
    bookBox: document.getElementById('bookBox'),
    dadTab: document.getElementById('dadTab'),
    dadDlg: document.getElementById('dadDlg'),
    dadPwd: document.getElementById('dadPwd'),
    dadLoad: document.getElementById('dadLoad'),
    faqList: document.getElementById('faqList'),
    board: document.getElementById('board'),
    pen: document.getElementById('pen'),
    eraser: document.getElementById('eraser'),
    clear: document.getElementById('clear'),
    save: document.getElementById('save'),
    guess: document.getElementById('guess'),
    aiState: document.getElementById('aiState'),
    color: document.getElementById('color'),
    size: document.getElementById('size'),
    whatToDraw: document.getElementById('whatToDraw'),
    drawIt: document.getElementById('drawIt'),
    bookFile: document.getElementById('bookFile'),
    buildIdx: document.getElementById('buildIdx'),
    bookStatus: document.getElementById('bookStatus'),
  };
  const S = { mode:'ask', autoVoice:false, gemKey:'', book:{text:'', chunks:[], name:''} };

  // ========== Cute Cat Family ==========
  const CAT_SKINS = [
    { label:"Dad",  base:"#ffd7e0", ear:"#ffb0c1", eye:"#2f2f46", nose:"#ff7aa2", whisk:"#c5b7c4" },
    { label:"Mama", base:"#dff6ff", ear:"#b7e9ff", eye:"#2f2f46", nose:"#7ac8ff", whisk:"#b7c5d8" },
    { label:"Baby", base:"#fff6d7", ear:"#ffe4a6", eye:"#2f2f46", nose:"#ffcf66", whisk:"#d8ccb0" },
  ];
  function catSVG(s, scale=1){
    return `
    <div class="catWrap text-center" data-lag="${scale*1.2}" style="transform-origin:50% 50%;transform:scale(${scale})">
      <div class="cloud">${s.label}</div>
      <svg class="cat" width="92" height="92" viewBox="0 0 120 120" aria-label="cat">
        <defs><radialGradient id="g${s.label}" cx="50%" cy="40%" r="70%">
          <stop offset="0%" stop-color="${s.base}"/><stop offset="100%" stop-color="${s.base}"/></radialGradient></defs>
        <path d="M30 35 L50 18 L52 42 Z" fill="${s.ear}"/><path d="M90 35 L70 18 L68 42 Z" fill="${s.ear}"/>
        <circle cx="60" cy="58" r="34" fill="url(#g${s.label})"/>
        <g class="eyes">
          <circle cx="47" cy="52" r="7" fill="#fff"/><circle cx="73" cy="52" r="7" fill="#fff"/>
          <circle class="pL" cx="47" cy="52" r="3" fill="${s.eye}"/><circle class="pR" cx="73" cy="52" r="3" fill="${s.eye}"/>
        </g>
        <polygon points="60,62 56,58 64,58" fill="${s.nose}"/>
        <rect class="mouth" x="54" y="68" width="12" height="4" rx="2" fill="${s.nose}" opacity=".6"/>
        <g stroke="${s.whisk}" stroke-width="2">
          <line x1="28" y1="64" x2="46" y2="64"/><line x1="28" y1="68" x2="46" y2="66"/>
          <line x1="74" y1="64" x2="92" y2="64"/><line x1="74" y1="66" x2="92" y2="68"/>
        </g>
      </svg>
    </div>`;
  }
  function buildFamily(){
    E.catFamily.innerHTML = CAT_SKINS.map((s,i)=>catSVG(s,[1,0.9,0.82][i])).join("");
  }
  buildFamily();

  // move pupils with cursor
  document.body.addEventListener('pointermove',(e)=>{
    document.querySelectorAll('.cat').forEach(svg=>{
      const r = svg.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = (e.clientX - cx)/r.width, dy = (e.clientY - cy)/r.height;
      const mx = Math.max(-1, Math.min(1, dx))*4, my = Math.max(-1, Math.min(1, dy))*4;
      svg.querySelectorAll('.pL,.pR').forEach(p=>p.setAttribute('transform',`translate(${mx},${my})`));
    });
  });

  // ========== Settings ==========
  E.settingsBtn.onclick = ()=>{
    E.gemKey.value = localStorage.getItem('g_key')||'';
    E.autoRead.checked = localStorage.getItem('g_auto')==='1';
    E.settingsDlg.showModal();
  };
  E.settingsDlg.addEventListener('close', ()=>{
    localStorage.setItem('g_key', E.gemKey.value.trim());
    localStorage.setItem('g_auto', E.autoRead.checked?'1':'0');
    S.gemKey = E.gemKey.value.trim(); S.autoVoice = E.autoRead.checked;
  });
  S.gemKey = localStorage.getItem('g_key')||'';
  S.autoVoice = localStorage.getItem('g_auto')==='1';

  // ========== Modes ==========
  E.modeBtns.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  function setMode(m){
    S.mode = m;
    E.askBox.classList.toggle('hidden', m!=='ask' && m!=='story');
    E.drawBox.classList.toggle('hidden', m!=='drawing');
    E.bookBox.classList.toggle('hidden', m!=='book');
  }
  setMode('ask');

  // ========== Sounds ==========
  let started = false;
  function ensureAudio(){ if(!started){ Tone.start(); started=true; } }
  const synth = new Tone.Synth().toDestination();
  const poly = new Tone.PolySynth(Tone.Synth).toDestination(); poly.volume.value=-8;
  document.body.addEventListener('pointerdown', ensureAudio);
  boing.onclick = ()=> synth.triggerAttackRelease('C6','8n');
  zap.onclick   = ()=> synth.triggerAttackRelease('G5','16n');
  pop.onclick   = ()=> poly.triggerAttackRelease(['C4','E4','A4'],'8n');

  // ========== Ask flow ==========
  function normQ(s){ return (s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
  function detectLang(s){ return /[اأ-ي]/.test(s)?'ar':'en'; }
  function showAnswer(text){ E.placeholder.classList.add('hidden'); E.bubble.classList.remove('hidden'); E.answer.textContent = text; }
  function showSnips(snips){
    E.snips.innerHTML = snips.map(s=>`<div class="bg-white/70 text-gray-800 p-2 rounded">${s}</div>`).join('');
  }

  async function callGemini(prompt){
    const key = S.gemKey; if(!key) return null;
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ parts:[{text: prompt}]}]})
      });
      const j = await r.json();
      return j.candidates?.[0]?.content?.parts?.[0]?.text || null;
    }catch(_){ return null; }
  }
  function buildPrompt(q, ctx=''){
    const pre = detectLang(q)==='ar'
      ? "اجب كأنك أب مرح يشرح لطفل صغير. اجعل الجمل قصيرة وبسيطة."
      : "Answer like a playful dad talking to a child. Use short, simple sentences.";
    return pre + (ctx? "\nContext:\n"+ctx : "") + "\n\nQuestion: " + q;
  }
  function offlineAsk(q){
    const en = "I'm not totally sure yet, but let's explore together!";
    const ar = "لست متأكدًا تمامًا، لكن دعنا نستكشف معًا!";
    return detectLang(q)==='ar'? ar : en;
  }

  // Book vector store (super light)
  function splitToChunks(text){
    const sents = text.split(/(?<=[\.\!\؟\?])\s+/);
    const chunks = [];
    for(let i=0;i<sents.length;i+=3){
      chunks.push(sents.slice(i,i+3).join(' '));
    }
    return chunks;
  }
  function score(q, chunk){
    const a = normQ(q).split(/\W+/).filter(Boolean);
    const b = normQ(chunk).split(/\W+/).filter(Boolean);
    if(!a.length||!b.length) return 0;
    let hit=0; a.forEach(t=>{ if(b.includes(t)) hit++; });
    return hit/(Math.sqrt(a.length)*Math.sqrt(b.length));
  }
  function topBookChunks(q, k=3){
    const arr = S.book.chunks.map(ch=>({ch, s: score(q,ch)})).sort((x,y)=>y.s-x.s).slice(0,k);
    return arr.filter(x=>x.s>0.05).map(x=>x.ch);
  }

  async function searchDadFAQ(q, lang){
    try{
      const r = await fetch(`/api/faq/search?lang=${encodeURIComponent(lang)}&q=${encodeURIComponent(normQ(q))}`);
      const j = await r.json(); return j.hit;
    }catch{ return null; }
  }

  async function doAsk(){
    const q = E.q.value.trim(); if(!q) return;
    ensureAudio();
    synth.triggerAttackRelease('E5','8n');
    const lang = detectLang(q);
    let answer = '';

    // Book first
    if (S.book.chunks.length){
      const snips = topBookChunks(q, 3);
      if (snips.length){
        showSnips(snips);
        const ctx = snips.join("\n\n");
        const ai = await callGemini(buildPrompt(q, ctx));
        answer = ai || snips[0];
      }
    }

    // Dad FAQ
    if (!answer){
      const hit = await searchDadFAQ(q, lang);
      if (hit && hit.answer) answer = hit.answer;
    }

    // AI
    if (!answer){
      const ai = await callGemini(buildPrompt(q));
      if (ai) answer = ai;
    }

    // Fallback
    if (!answer) answer = offlineAsk(q);

    showAnswer(answer);
    if (localStorage.getItem('g_auto')==='1') speak(answer, lang);

    // Log
    fetch('/api/log',{ method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ kid:E.kid.value||'', mode:S.mode, question:q, answer, book:S.book.name||null }) }).catch(()=>{});

    // Help bar
    showHelpBar(q, answer, lang);
  }
  askBtn.onclick = doAsk;
  magic.onclick = doAsk;
  readBtn.onclick = ()=> speak(E.answer.textContent || E.q.value, detectLang(E.answer.textContent||E.q.value||'en'));

  // Help bar
  function showHelpBar(q, a, lang){
    const old = document.getElementById('helpbar'); if (old) old.remove();
    const bar = document.createElement('div'); bar.id='helpbar';
    bar.className='mt-3 flex flex-wrap items-center gap-2';
    bar.innerHTML = `
      <span class="tag">${lang==='ar'?'هل فهمت؟':'Did that help?'}</span>
      <button class="btn-sec px-3 py-2 rounded-lg">${lang==='ar'?'فهمت ✅':'I got it ✅'}</button>
      <button class="btn-sec px-3 py-2 rounded-lg">${lang==='ar'?'اشرح أكثر 🔁':'Explain more 🔁'}</button>
      <button class="btn-sec px-3 py-2 rounded-lg">📧 ${lang==='ar'?'اسأل بابا':'Ask Dad'}</button>`;
    E.answer.appendChild(bar);
    const [okBtn, moreBtn, dadBtn] = bar.querySelectorAll('button');
    okBtn.onclick = ()=> bar.remove();
    moreBtn.onclick = async ()=>{
      const simple = await callGemini(
        lang==='ar' ? `اشرح لطفل صغير ببساطة شديدة:\n\n${a}` : `Explain to a small child in 2–3 short, simple sentences:\n\n${a}`
      );
      if (simple){ E.answer.childNodes[0].textContent = simple; if (S.autoVoice) speak(simple, lang); }
    };
    dadBtn.onclick = async ()=>{
      const r = await fetch('/api/email',{ method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ kid:E.kid.value||'Kid', question:q, answer:a })});
      alert(r.ok? (lang==='ar'?'تم الإرسال إلى بابا':'Sent to Dad!') : 'Email failed');
    };
  }

  // ========== TTS ==========
  function speak(text, lang){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (lang==='ar')? 'ar-SA' : 'en-US';
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }

  // ========== Book upload & index ==========
  let uploadedArrayBuffer = null;
  bookFile.addEventListener('change', async (ev)=>{
    const f = ev.target.files[0]; if(!f) return;
    S.book.name = f.name;
    bookStatus.textContent = 'Loaded: ' + f.name;
    uploadedArrayBuffer = await f.arrayBuffer();
  });
  buildIdx.onclick = async ()=>{
    if (!uploadedArrayBuffer){ alert('Upload a book first'); return; }
    const name = (S.book.name||'').toLowerCase();
    let txt='';
    try{
      if (name.endsWith('.txt')){
        txt = new TextDecoder().decode(uploadedArrayBuffer);
      } else if (name.endsWith('.pdf')){
        const pdf = await pdfjsLib.getDocument({data: uploadedArrayBuffer}).promise;
        let parts=[]; for(let i=1;i<=pdf.numPages;i++){ const page = await pdf.getPage(i); const t=await page.getTextContent(); parts.push(t.items.map(it=>it.str).join(' ')); }
        txt = parts.join('\n\n');
      } else if (name.endsWith('.docx')){
        const res = await window.mammoth.extractRawText({arrayBuffer: uploadedArrayBuffer}); txt = res.value;
      } else if (name.endsWith('.epub')){
        txt = new TextDecoder().decode(uploadedArrayBuffer); // lightweight fallback
      } else { alert('Unsupported file'); return; }
    }catch(e){ alert('Could not read file.'); return; }
    S.book.text = txt;
    S.book.chunks = (function splitToChunks(t){
      const sents = t.split(/(?<=[\.\!\؟\?])\s+/); const chunks=[];
      for(let i=0;i<sents.length;i+=3) chunks.push(sents.slice(i,i+3).join(' '));
      return chunks;
    })(txt);
    bookStatus.textContent = 'Indexed ' + S.book.chunks.length + ' pieces';
  };

  // ========== Drawing board ==========
  const g = board.getContext('2d');
  let drawing=false, erasing=false;
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#000'; g.lineWidth=8;
  function ppos(ev){ const r = board.getBoundingClientRect(); const x=(ev.clientX - r.left)*(board.width/r.width); const y=(ev.clientY - r.top)*(board.height/r.height); return {x,y}; }
  board.addEventListener('pointerdown', ev=>{ drawing=true; const {x,y}=ppos(ev); g.beginPath(); g.moveTo(x,y); });
  board.addEventListener('pointermove', ev=>{ if(!drawing) return; const {x,y}=ppos(ev); if(erasing){ g.clearRect(x-10,y-10,20,20);} else { g.lineTo(x,y); g.stroke(); } });
  board.addEventListener('pointerup', ()=> drawing=false);
  pen.onclick=()=>{ erasing=false; g.strokeStyle=color.value; g.lineWidth=+size.value; };
  eraser.onclick=()=>{ erasing=true; g.lineWidth=20; };
  clear.onclick=()=>{ g.fillStyle='#fff'; g.fillRect(0,0,board.width,board.height); g.fillStyle=color.value; };
  save.onclick=()=>{ const a=document.createElement('a'); a.href=board.toDataURL('image/png'); a.download='drawing.png'; a.click(); };
  color.oninput=()=> g.strokeStyle=color.value;
  size.oninput = ()=> g.lineWidth = +size.value;
  g.fillStyle='#fff'; g.fillRect(0,0,board.width,board.height); g.fillStyle='#000';

  // Guess via ml5 DoodleNet (best-effort)
  let doodle=null;
  (async ()=>{
    try{
      const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/ml5/0.12.2/ml5.min.js'; document.head.appendChild(s);
      await new Promise(res=>{s.onload=res;});
      doodle = await window.ml5.imageClassifier('DoodleNet');
      aiState.textContent='AI: ready ✅';
    }catch(_){ aiState.textContent='AI: error'; }
  })();
  guess.onclick = async ()=>{
    if(!doodle){ alert('AI not ready'); return; }
    doodle.classify(board, (err, res)=>{
      if(err || !res?.[0]){ alert('No guess'); return; }
      showAnswer(`I think it's a **${res[0].label}**! (confidence ${Math.round(res[0].confidence*100)}%)`);
    });
  };

  // Draw by name (cute animals)
  drawIt.onclick = ()=>{
    const p = (whatToDraw.value||'').toLowerCase();
    const W=board.width, H=board.height;
    g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    if (/cat|قط/.test(p)) cuteCat(g,W,H);
    else if (/dog|كلب/.test(p)) cuteDog(g,W,H);
    else if (/bunny|rabbit|أرنب/.test(p)) cuteBunny(g,W,H);
    else if (/bird|عصفور|طائر/.test(p)) cuteBird(g,W,H);
    else if (/fish|سمكة/.test(p)) cuteFish(g,W,H);
    else { g.fillStyle='#222'; g.font='28px system-ui'; g.fillText('Try: cat, dog, bunny, bird, fish', 20, 50); }
  };

  function cuteCat(g,W,H){
    const cx=W/2, cy=H/2+10;
    g.fillStyle='#fff2f7'; g.beginPath(); g.arc(cx,cy,90,0,Math.PI*2); g.fill();
    g.fillStyle='#ffd6e7'; g.beginPath(); g.moveTo(cx-60,cy-90); g.lineTo(cx-30,cy-140); g.lineTo(cx-10,cy-90); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx+60,cy-90); g.lineTo(cx+30,cy-140); g.lineTo(cx+10,cy-90); g.closePath(); g.fill();
    g.fillStyle='#1f2937'; g.beginPath(); g.arc(cx-25,cy-10,8,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(cx+25,cy-10,8,0,Math.PI*2); g.fill();
    g.fillStyle='#ff9ec2'; g.beginPath(); g.arc(cx,cy+15,8,0,Math.PI*2); g.fill();
  }
  function cuteDog(g,W,H){
    const cx=W/2, cy=H/2+10;
    g.fillStyle='#ffe8cc'; g.beginPath(); g.arc(cx,cy,90,0,Math.PI*2); g.fill();
    g.fillStyle='#d9b38c'; g.beginPath(); g.arc(cx-65,cy-50,30,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(cx+65,cy-50,30,0,Math.PI*2); g.fill();
    g.fillStyle='#1f2937'; g.beginPath(); g.arc(cx-35,cy-10,10,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(cx+35,cy-10,10,0,Math.PI*2); g.fill();
    g.fillStyle='#ffadad'; g.beginPath(); g.arc(cx,cy+20,10,0,Math.PI*2); g.fill();
    g.strokeStyle='#1f2937'; g.lineWidth=3; g.beginPath(); g.moveTo(cx,cy+25); g.quadraticCurveTo(cx,cy+40,cx-20,cy+36); g.moveTo(cx,cy+25); g.quadraticCurveTo(cx,cy+40,cx+20,cy+36); g.stroke();
  }
  function cuteBunny(g,W,H){
    const cx=W/2, cy=H/2+20;
    g.fillStyle='#fff2f7'; g.beginPath(); g.arc(cx,cy,90,0,Math.PI*2); g.fill();
    g.fillStyle='#ffd6e7'; g.fillRect(cx-60,cy-120,30,70); g.fillRect(cx+30,cy-120,30,70);
    g.fillStyle='#1f2937'; g.beginPath(); g.arc(cx-30,cy-10,8,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(cx+30,cy-10,8,0,Math.PI*2); g.fill();
    g.fillStyle='#ff9ec2'; g.beginPath(); g.arc(cx,cy+15,8,0,Math.PI*2); g.fill();
  }
  function cuteBird(g,W,H){
    const cx=W/2, cy=H/2;
    g.fillStyle='#d0f0ff'; g.beginPath(); g.ellipse(cx,cy,80,60,0,0,Math.PI*2); g.fill();
    g.fillStyle='#1f2937'; g.beginPath(); g.arc(cx+20,cy-10,6,0,Math.PI*2); g.fill();
    g.fillStyle='#ffcc66'; g.beginPath(); g.moveTo(cx+50,cy); g.lineTo(cx+75,cy+10); g.lineTo(cx+50,cy+20); g.closePath(); g.fill();
  }
  function cuteFish(g,W,H){
    const cx=W/2, cy=H/2;
    g.fillStyle='#c8e6ff'; g.beginPath(); g.ellipse(cx,cy,100,50,0,Math.PI*2); g.fill();
    g.fillStyle='#a5d8ff'; g.beginPath(); g.moveTo(cx-110,cy); g.lineTo(cx-140,cy-30); g.lineTo(cx-140,cy+30); g.closePath(); g.fill();
    g.fillStyle='#1f2937'; g.beginPath(); g.arc(cx+40,cy-5,6,0,Math.PI*2); g.fill();
  }

  // ========== Dad dashboard ==========
  dadTab.onclick = ()=> dadDlg.showModal();
  dadLoad.onclick = async ()=>{
    const pwd = dadPwd.value.trim(); if(!pwd){ alert('Password required'); return; }
    const auth = 'Basic ' + btoa('dad:'+pwd);
    const rows = await fetch('/api/admin/list', { headers:{authorization:auth} }).then(r=>r.json()).catch(()=>[]);
    faqList.innerHTML = rows.slice(0,50).map(r=>`
      <div class="p-3 rounded bg-white/80">
        <div class="text-xs text-gray-600">${r.ts} • ${r.mode}</div>
        <div class="font-semibold text-gray-900">${(r.question||'')}</div>
        <textarea data-q="${(r.question||'').replaceAll('"','&quot;')}" class="w-full mt-1 p-2 rounded border" rows="3">${(r.answer||'')}</textarea>
        <div class="mt-1 flex gap-2">
          <button data-lang="en" class="save btn-sec px-3 py-1 rounded">Save as EN</button>
          <button data-lang="ar" class="save btn-sec px-3 py-1 rounded">Save as AR</button>
        </div>
      </div>`).join('');

    faqList.querySelectorAll('.save').forEach(btn=>{
      btn.onclick = async (ev)=>{
        ev.preventDefault();
        const box = btn.closest('div'); const ta = box.querySelector('textarea');
        const question = ta.dataset.q; const answer = ta.value; const lang = btn.dataset.lang;
        const ok = await fetch('/api/faq/upsert', {
          method:'POST', headers:{'Content-Type':'application/json', authorization:auth},
          body: JSON.stringify({lang, question, answer})
        }).then(r=>r.ok);
        alert(ok ? 'Saved ✅' : 'Failed');
      };
    });
  };
  </script>
</body>
</html>
