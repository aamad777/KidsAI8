<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dad AI Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

<style>
  body{margin:0;font-family:ui-sans-serif,system-ui;background:linear-gradient(135deg,#141b2e,#26356e,#314593);color:#fff;}
  .chat-bubble{max-width:70%;padding:.6rem 1rem;border-radius:1rem;margin:.5rem 0;}
  .kid{background:#3b82f6;color:white;align-self:flex-start;}
  .kid.girl{background:#ec4899;}
  .dad{background:#facc15;color:black;align-self:flex-end;}
  #chat{height:60vh;overflow-y:auto;display:flex;flex-direction:column;padding:1rem;}
  #mascot{width:100px;height:100px;position:fixed;bottom:20px;right:20px;transition:transform 1s ease;}
  .fly{animation:flyAround 2s ease-in-out;}
  @keyframes flyAround{
    0%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(-120px,-80px) rotate(20deg);}
    50%{transform:translate(100px,-120px) rotate(-20deg);}
    75%{transform:translate(-80px,60px) rotate(10deg);}
    100%{transform:translate(0,0) rotate(0deg);}
  }
</style>
</head>
<body class="flex flex-col items-center">

<h1 class="text-3xl font-bold p-4">🐱 Dad AI Chat</h1>

<!-- Intro step -->
<div id="intro" class="p-4 max-w-md text-black bg-white rounded-xl">
  <p class="mb-2">Welcome! Let’s set up your chat 🤗</p>
  <input id="kidName" placeholder="Your name" class="w-full p-2 mb-2 rounded"/>
  <input id="kidAge" type="number" placeholder="Your age" class="w-full p-2 mb-2 rounded"/>
  <select id="kidGender" class="w-full p-2 mb-2 rounded">
    <option value="">Boy or Girl?</option>
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>
  <button id="startBtn" class="bg-yellow-400 px-4 py-2 rounded font-bold">Start Chat</button>
</div>

<!-- Chat box -->
<div id="chatUI" class="hidden w-full max-w-2xl flex flex-col flex-grow">
  <div id="chat" class="card flex-grow"></div>
  <div class="flex gap-2 p-3">
    <input id="msg" class="flex-grow rounded px-3 py-2 text-black" placeholder="Type your question..."/>
    <button id="sendBtn" class="bg-yellow-400 px-4 py-2 rounded font-bold">Send</button>
  </div>
</div>

<!-- Robot -->
<svg id="mascot" viewBox="0 0 160 160">
  <rect x="40" y="48" rx="16" ry="16" width="80" height="56" fill="#7dd3fc" stroke="#0f172a" stroke-width="3"/>
  <circle cx="62" cy="76" r="8" fill="#fff"/><circle cx="98" cy="76" r="8" fill="#fff"/>
  <circle id="eyeL2" cx="62" cy="76" r="3" fill="#0f172a"/><circle id="eyeR2" cx="98" cy="76" r="3" fill="#0f172a"/>
  <line x1="80" y1="48" x2="80" y2="28" stroke="#0f172a" stroke-width="3"/>
  <circle cx="80" cy="26" r="5" fill="#ef4444"/>
</svg>

<script>
const GEMINI_KEY = "AIzaSyDdG9ozT6-il9J0toab_HFLZPQIau_sb0g"; // put your Gemini key

let kid={name:"",age:"",gender:"boy"};

function addMsg(text,from){
  const div=document.createElement("div");
  div.className="chat-bubble "+(from==="kid"?(kid.gender==="girl"?"kid girl":"kid"):"dad");
  div.textContent=text;
  document.querySelector("#chat").appendChild(div);
  document.querySelector("#chat").scrollTop=99999;
}

async function callGemini(q){
  if(!GEMINI_KEY || GEMINI_KEY==="AIzaSyDdG9ozT6-il9J0toab_HFLZPQIau_sb0g") return null;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
    method:"POST",headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:q}]}]})
  });
  const j=await r.json();
  return j.candidates?.[0]?.content?.parts?.[0]?.text || null;
}

// Start
document.querySelector("#startBtn").onclick=()=>{
  kid.name=document.querySelector("#kidName").value||"friend";
  kid.age=document.querySelector("#kidAge").value||"?";
  kid.gender=document.querySelector("#kidGender").value||"boy";
  document.querySelector("#intro").classList.add("hidden");
  document.querySelector("#chatUI").classList.remove("hidden");
  addMsg(`Hi! I'm ${kid.name}, I'm ${kid.age} years old!`, "kid");
  addMsg(`Hello ${kid.name}! I’m Dad AI. Ask me anything 🤖`, "dad");
};

document.querySelector("#sendBtn").onclick=async()=>{
  const q=document.querySelector("#msg").value.trim();
  if(!q) return;
  addMsg(q,"kid");
  document.querySelector("#msg").value="";
  // Robot fly
  const robot=document.querySelector("#mascot");
  robot.classList.add("fly");
  setTimeout(()=>robot.classList.remove("fly"),2000);

  // Compliment
  const compliments=["Great question!","Nice thinking!","Wow, clever!","Good job!"];
  addMsg(compliments[Math.floor(Math.random()*compliments.length)],"dad");

  // AI Answer
  let ans=await callGemini(`Answer simply for a ${kid.age} year old ${kid.gender}. Question: ${q}`);
  if(!ans) ans=`Hmm, I think about it: ${q} is very interesting!`;
  addMsg(ans,"dad");
};
</script>
</body>
</html>
