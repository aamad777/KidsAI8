<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dad AI — play • learn • ask</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

  <style>
    :root {
      --ink:#f8fafc;
      --ink2:#e2e8f0;
      --brand:#f59e0b;
    }

    body{
      margin:0;
      color:var(--ink);
      font-family: system-ui, ui-sans-serif, "Segoe UI", Roboto;
      background: linear-gradient(135deg, #4f46e5, #818cf8); /* original blue */
    }
    .card{ background:#ffffff1a; backdrop-filter:blur(8px); border-radius:18px; padding:1rem; }
    .btn{ background:#ffd54a; color:#1f2937; font-weight:800; border-radius:12px; padding:.6rem 1rem }
    .btn-sec{ background:#0f172a; color:#fff; font-weight:700; border-radius:12px; padding:.55rem .9rem }
    .pill{ background:#0f172a; color:#fff; padding:.45rem .8rem; border-radius:999px; font-weight:800 }
    .tag{ background:#334155; color:#fff; padding:.25rem .6rem; border-radius:999px; font-size:.85rem }

    canvas{ touch-action:none }

    #mascot {
      position: fixed; bottom: 20px; right: 20px;
      width: 140px; height: 140px; z-index: 1000;
      animation: floaty 6s ease-in-out infinite; cursor:pointer;
    }
    @keyframes floaty { 0%,100%{ transform: translateY(0) rotate(-2deg) } 50%{ transform: translateY(-10px) rotate(2deg) } }

    .cat-wrap { display:flex; gap:14px; align-items:flex-end }
    .cat-card{ position:relative; width:86px; height:86px; cursor:pointer; }
    .cat-label{ position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#fff; color:#111; font-size:12px; padding:2px 8px; border-radius:999px }

    .sparkle {
      position:absolute; pointer-events:none; width:10px; height:10px; border-radius:50%;
      background: radial-gradient(circle, #fff 0%, #ffe08a 50%, transparent 70%);
      animation: pop 900ms ease-out forwards;
      filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ffd54a);
    }
    @keyframes pop{
      0%{ transform: translate(0,0) scale(.6); opacity:.9 }
      100%{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0 }
    }
    .sketch-frame{ position:relative; border-radius:14px; overflow:hidden; border:2px dashed #818cf8 }
    .sketch-label{ position:absolute; top:8px; left:8px; background:#0f172a; color:#fff;
      padding:2px 8px; border-radius:999px; font-weight:800; font-size:.8rem; }
  </style>
</head>
<body>
  <!-- Floating robot -->
  <div id="mascot" title="About Dad AI">
    <svg id="mascotSVG" viewBox="0 0 140 140" width="140" height="140">
      <rect x="30" y="30" rx="14" ry="14" width="80" height="60" fill="#7dd3fc" stroke="#0f172a" stroke-width="3"/>
      <circle cx="55" cy="58" r="8" fill="#fff"/><circle cx="85" cy="58" r="8" fill="#fff"/>
      <circle id="eyeL2" cx="55" cy="58" r="3" fill="#0f172a"/><circle id="eyeR2" cx="85" cy="58" r="3" fill="#0f172a"/>
      <line x1="70" y1="30" x2="70" y2="16" stroke="#0f172a" stroke-width="3"/>
      <circle cx="70" cy="14" r="4" fill="#ef4444"/>
    </svg>
  </div>

  <!-- Header -->
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <div class="card flex items-center gap-4 justify-between">
      <div class="flex items-center gap-4">
        <div id="catFamily" class="cat-wrap"></div>
        <div>
          <div class="text-2xl sm:text-3xl font-black">Dad <span class="text-yellow-300">AI</span></div>
          <div class="text-sm">Ask, draw, and learn — English & Arabic</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input id="kidName" class="px-3 py-2 rounded-lg text-black" placeholder="Kid name"/>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Left: Ask + Books -->
      <div class="space-y-4">
        <div class="card">
          <div class="flex gap-2 mb-3"><span class="pill">Ask</span></div>
          <div class="flex gap-2 items-stretch">
            <input id="question" class="flex-1 rounded-lg px-3 py-3 text-black" placeholder="Why is the sky blue?"/>
            <button id="askBtn" class="btn">Ask!</button>
          </div>
          <div class="mt-2 text-sm">AI: <span id="aiStatus">checking…</span></div>
        </div>

        <div class="card">
          <div class="flex gap-2 mb-3"><span class="pill">Drawing Pad</span></div>
          <div class="flex flex-wrap items-center gap-2">
            <button id="pen" class="btn-sec">✏️ Pen</button>
            <button id="eraser" class="btn-sec">🧽 Eraser</button>
            <button id="clear" class="btn-sec">🧺 Clear</button>
            <input id="color" type="color" value="#000000"/>
            <input id="size" type="range" min="2" max="40" value="8"/>
          </div>
          <canvas id="board" width="900" height="420" class="w-full bg-white rounded-xl mt-3"></canvas>
        </div>
      </div>

      <!-- Right: Answer + Mini Sketch -->
      <div class="space-y-4">
        <div id="answerCard" class="card relative">
          <div class="text-sm mb-1">Answer</div>
          <div id="answer" class="text-lg">Ask something and I’ll speak! 🗣️</div>
        </div>

        <div class="card">
          <div class="sketch-frame">
            <span class="sketch-label">Tiny doodle ✏️</span>
            <canvas id="miniSketch" width="900" height="260" class="w-full bg-white"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const GEMINI_KEY = "AIzaSyDdG9ozT6-il9J0toab_HFLZPQIau_sb0g"; // put your Gemini API key

function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.pitch=1.1; u.rate=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch{}
}

async function callGemini(prompt){
  if(!GEMINI_KEY || GEMINI_KEY==="AIzaSyDdG9ozT6-il9J0toab_HFLZPQIau_sb0g") return null;
  try{
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }]}] })
    });
    const j = await r.json();
    return j.candidates?.[0]?.content?.parts?.[0]?.text || null;
  }catch(e){ return null; }
}

function sparkleBurst(container){
  const rect=container.getBoundingClientRect();
  for(let i=0;i<20;i++){
    const sp=document.createElement('div'); sp.className='sparkle';
    sp.style.left=Math.random()*rect.width+'px';
    sp.style.top=Math.random()*rect.height+'px';
    sp.style.setProperty('--dx',(Math.random()*140-70)+'px');
    sp.style.setProperty('--dy',(-40-Math.random()*120)+'px');
    container.appendChild(sp); setTimeout(()=>sp.remove(),900);
  }
}

// Ask
document.getElementById('askBtn').addEventListener('click',async()=>{
  const q=document.getElementById('question').value.trim();
  const ansEl=document.getElementById('answer');
  ansEl.textContent="Thinking…";
  let ans=await callGemini("Answer simply for kids: "+q);
  if(!ans) ans="Great question! Trees give us fruit, shade, and wood!";
  ansEl.textContent=ans; speak(ans);
  sparkleBurst(document.getElementById('answerCard'));
});

// Drawing pad
const board=document.getElementById('board'); const g=board.getContext('2d');
g.fillStyle='#fff'; g.fillRect(0,0,board.width,board.height); g.strokeStyle='#000'; g.lineWidth=8; g.lineCap='round';
let drawing=false, erasing=false;
board.addEventListener('pointerdown',e=>{drawing=true; g.beginPath(); g.moveTo(e.offsetX,e.offsetY);});
board.addEventListener('pointermove',e=>{ if(!drawing) return; if(erasing){ g.clearRect(e.offsetX-10,e.offsetY-10,20,20);} else { g.lineTo(e.offsetX,e.offsetY); g.stroke(); }});
board.addEventListener('pointerup',()=>drawing=false);
document.getElementById('pen').onclick=()=>{ erasing=false; g.strokeStyle=document.getElementById('color').value; g.lineWidth=+document.getElementById('size').value; };
document.getElementById('eraser').onclick=()=>{ erasing=true; g.lineWidth=20; };
document.getElementById('clear').onclick=()=>{ g.fillStyle='#fff'; g.fillRect(0,0,board.width,board.height); };

// Cat family
const catWrap=document.getElementById('catFamily');
function cat(label,color){ return `<div class="cat-card"><div class="cat-label">${label}</div><svg class="cat" viewBox="0 0 120 120" width="86" height="86"><circle cx="60" cy="62" r="36" fill="${color}"/></svg></div>`;}
catWrap.innerHTML=cat("Dad","#222")+cat("Mama","#f4b6d8")+cat("Baby","#ffdca8");
</script>
</body>
</html>
